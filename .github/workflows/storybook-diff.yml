name: Storybook Diff

# Builds Storybook for base and head, finds the stories whose rendering changed,
# uploads the diff gallery as a workflow artifact, and posts the summary as a PR comment.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Skip the heavy build and diff when the PR touches nothing a story depends on
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check changed files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          echo "changed files:" && echo "$files"
          if echo "$files" | grep -qE '^(packages/|\.storybook/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  storybook-diff:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: pnpm

      # `prepare` builds shared-components into dist
      - name: Install dependencies (head)
        run: pnpm install --frozen-lockfile

      # --stats-json writes preview-stats.json, the dependency graph used to find
      # the stories that import a changed file
      - name: Build storybook (head)
        run: pnpm run build-storybook --output-dir /tmp/sb-head --stats-json

      # A worktree keeps head's checkout and node_modules untouched while base is built
      - name: Build storybook (base)
        run: |
          git worktree add /tmp/sb-base-tree ${{ github.event.pull_request.base.sha }}
          pnpm --dir /tmp/sb-base-tree install --frozen-lockfile
          pnpm --dir /tmp/sb-base-tree run build-storybook --output-dir /tmp/sb-base

      - name: Collect changed files
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD > /tmp/sb-changed.txt
          echo "changed files:" && cat /tmp/sb-changed.txt

      - name: Generate story diff
        uses: hayashikun/storybook-diff@f8e1ab077f7ba439710ca7c609bb0f151ab09124 # main
        with:
          base-static: /tmp/sb-base
          head-static: /tmp/sb-head
          changed-files: /tmp/sb-changed.txt
          out: /tmp/sb-report
          # The apps import shared-components through its built dist, where the
          # dependency graph stops. A change in it puts every story in scope
          dist-boundary-packages: packages/shared-components
          pr-title: ${{ github.event.pull_request.title }}
          pr-url: ${{ github.event.pull_request.html_url }}
          # Use the node set up above (.tool-versions)
          node-version: ''

      # Put both Storybooks next to the gallery, so each diff links to the real story
      - name: Add Storybooks to the report
        run: |
          cp -r /tmp/sb-base /tmp/sb-report/storybook-base
          cp -r /tmp/sb-head /tmp/sb-report/storybook-head

      - name: Upload report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-diff-pr-${{ github.event.pull_request.number }}
          path: /tmp/sb-report
          retention-days: 14

      # Keep a single comment per PR and update it on every push
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')
            const marker = '<!-- storybook-diff -->'
            let summary = 'Failed to generate the Storybook diff report.'
            try {
              summary = fs.readFileSync('/tmp/sb-report/summary.md', 'utf-8')
            } catch (e) {
              core.warning(`Could not read summary.md: ${e}`)
            }
            const url = process.env.ARTIFACT_URL
            const link = url
              ? `\n\n📷 Diff gallery: [download the report](${url}), unzip it and open \`index.html\`.`
              : ''
            const body = `${marker}\n${summary}${link}`

            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
